[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-lab"
version = "0.8.0"
description = "面向初学者的 A 股日线数据与可复现回测实验室"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Zhaolong666520", email = "1465024680@qq.com" },
]
requires-python = ">=3.11,<3.14"
keywords = [
  "a-share",
  "backtesting",
  "financial-data",
  "quantitative-finance",
  "walk-forward-analysis",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "akshare>=1.17,<2",
  "baostock>=0.8.9,<1",
  "duckdb>=1.2,<2",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
finance-lab = "finance_lab.cli:main"

[project.urls]
Homepage = "https://github.com/Zhaolong666520/a-share-quant-lab"
Repository = "https://github.com/Zhaolong666520/a-share-quant-lab"
Issues = "https://github.com/Zhaolong666520/a-share-quant-lab/issues"
Changelog = "https://github.com/Zhaolong666520/a-share-quant-lab/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
