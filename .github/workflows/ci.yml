name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0 wheel==0.46.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy src

      - name: pytest
        run: python -m pytest --cov=finance_lab --cov-branch --cov-report=term-missing --cov-fail-under=80

      - name: Markdown links
        run: python scripts/check_markdown_links.py

      - name: Compile
        run: python -m compileall -q src tests

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-lock.txt
          python -m pip_audit -r requirements-lock.txt --strict

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0 wheel==0.46.2
          python -m pip install -r requirements-lock.txt
          python -m build --no-isolation

      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv smoke-venv
          smoke-venv/bin/python -m pip install dist/*.whl
          smoke-venv/bin/python -c "import finance_lab; print(finance_lab.__version__)"
          smoke-venv/bin/finance-lab --help

  posix-demo:
    name: demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run offline demo
        shell: bash
        run: ./run_demo.sh

      - name: Verify demo report
        shell: bash
        run: test -f outputs/demo_000300_sma_report.html
